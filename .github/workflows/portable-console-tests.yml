name: Portable Console Host Tests
on:
  push:
    branches:
      - feature/portable-controller-widescreen
  pull_request:
    paths:
      - 'portable/**'
      - 'src/display_geometry.h'
      - 'tests/portable_port_test.c'
      - 'platforms/switch/**'
      - '.github/workflows/portable-console-tests.yml'
jobs:
  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile shared navigation and display tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic tests/portable_port_test.c -lm -o /tmp/ffd-port-test
          /tmp/ffd-port-test
      - name: Compile Switch menu layout and repeat tests
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic platforms/switch/test_menu_layout.c -lm -o /tmp/ffd-switch-nav-test
          /tmp/ffd-switch-nav-test
      - name: Check Switch Python scripts
        run: |
          python3 -m py_compile platforms/switch/apply_switch_loader.py platforms/switch/verify_switch_profile.py
